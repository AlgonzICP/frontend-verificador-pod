<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificador de POD</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        label, select, input, button { display: block; margin-top: 15px; width: 100%; }
        #resultado { margin-top: 25px; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h2>Verificador de POD</h2>

    <label for="imagen">Selecciona el POD (imagen):</label>
    <input type="file" id="imagen" accept="image/*" />

    <label for="transportista">Selecciona el transportista:</label>
    <select id="transportista">
        <option value="correosped">CORREOSPED</option>
        <option value="chrono">CHRONO</option>
        <option value="gls">GLS</option>
        <option value="seur">SEUR</option>
    </select>

    <label for="nombreCliente">Introduce el nombre del cliente:</label>
    <input type="text" id="nombreCliente" placeholder="Ej. Jose Luis Jiménez" />

    <button onclick="enviar()">Extraer Nombre y DNI</button>

    <div id="resultado"></div>

    <script>
        async function enviar() {
            const fileInput = document.getElementById('imagen');
            const transportista = document.getElementById('transportista').value;
            const nombreCliente = document.getElementById('nombreCliente').value;
            const resultadoDiv = document.getElementById('resultado');

            if (fileInput.files.length === 0) {
                alert("Por favor, selecciona una imagen.");
                return;
            }

            if (!nombreCliente.trim()) {
                alert("Por favor, introduce el nombre del cliente.");
                return;
            }

            const formData = new FormData();
            formData.append("imagen", fileInput.files[0]);
            formData.append("transportista", transportista);
            formData.append("nombreCliente", nombreCliente);

            resultadoDiv.innerHTML = "⏳ Procesando imagen...";

            try {
                const response = await fetch("https://verificador-pod.onrender.com/api/pod", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                resultadoDiv.innerHTML = `<strong>Resultado:</strong><br>${data.resultado.replace(/\n/g, "<br>")}<br><br><strong>Nombre esperado:</strong> ${data.nombreEsperado}`;
            } catch (error) {
                resultadoDiv.innerHTML = "❌ Error al procesar la imagen.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
